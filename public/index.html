.site-header { position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: 76px; display: flex; align-items: center; padding: 0 5.4vw; border-bottom: 1px solid #dfe2dcbb; background: #f7f7f3c9; backdrop-filter: blur(14px); }
.wordmark { display: inline-flex; align-items: center; gap: 10px; font: 800 17px var(--display); letter-spacing: -.8px; }
.mark { width: 20px; height: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; transform: rotate(-11deg); }
.mark i { display: block; border-radius: 2px; background: var(--blue); }
.mark i:nth-child(2), .mark i:nth-child(3) { background: var(--ink); }
.desktop-nav { display: flex; gap: 31px; margin-left: auto; margin-right: 35px; color: #5e6562; font-size: 12px; }
.desktop-nav a, .footer-right a { transition: color .2s; }
.desktop-nav a:hover, .footer-right a:hover { color: var(--blue); }
.header-cta { min-height: 37px; display: inline-flex; align-items: center; gap: 16px; padding: 0 14px; border: 1px solid #b8beb8; border-radius: 3px; font-size: 11px; font-weight: 600; transition: color .2s, background .2s, border .2s; }
.header-cta:hover { color: white; border-color: var(--ink); background: var(--ink); }
.chapter-rail { position: fixed; z-index: 15; top: 50%; right: 26px; display: grid; gap: 11px; transform: translateY(-50%); }
.chapter-rail a { width: 24px; height: 24px; display: grid; place-items: center; color: #969d9a; border-radius: 50%; font: 8px var(--mono); transition: color .2s, background .2s, transform .2s; }
.chapter-rail a::before { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #9fa6a4; content: ""; transition: opacity .2s; }
.chapter-rail a span { opacity: 0; }
.chapter-rail a[aria-current="step"] { color: #fff; background: var(--blue); transform: scale(1.08); }
.chapter-rail a[aria-current="step"]::before { opacity: 0; }
.chapter-rail a[aria-current="step"] span { opacity: 1; }
.chapter-rail a:hover { color: white; background: #737fe1; }

.story { position: relative; z-index: 1; }
.chapter { position: relative; min-height: 100svh; display: flex; align-items: center; padding: 110px 12vw 76px 10vw; scroll-snap-align: start; scroll-snap-stop: always; }
.chapter-content { position: relative; z-index: 2; width: min(520px, 50vw); }
.hero-content { position: static; width: min(570px, 53vw); padding-top: 24px; }
.eyebrow, .chapter-kicker { color: #777f7b; font: 500 9px/1.55 var(--mono); letter-spacing: .075em; }
.hero-content > .eyebrow { display: flex; align-items: center; gap: 9px; color: #505956; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: #87b978; box-shadow: 0 0 0 3px #87b97825; }
h1, h2, h3, p { margin-top: 0; }
h1, h2, h3 { font-family: var(--display); }
h1 { margin: 28px 0 23px; font-size: clamp(68px, 6vw, 86px); font-weight: 600; line-height: .93; letter-spacing: -.092em; }
h1 em, h2 em { color: var(--blue); font-style: normal; }
.chapter h2 { margin: 25px 0 22px; font-size: clamp(45px, 5.6vw, 72px); font-weight: 600; line-height: .99; letter-spacing: -.082em; }
.chapter-intro { max-width: 480px; margin: 0; color: #626b67; font-size: 15px; line-height: 1.8; }
.hero-actions { display: flex; align-items: center; gap: 25px; margin-top: 31px; }
.button { min-height: 49px; display: inline-flex; align-items: center; justify-content: center; gap: 22px; padding: 0 18px; border: 1px solid transparent; border-radius: 3px; font-size: 11px; font-weight: 600; cursor: pointer; transition: transform .18s, background .18s, border .18s, color .18s; }
.button:hover { transform: translateY(-2px); }
.button:focus-visible, a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.button-dark { color: white; background: var(--ink); }
.button-dark:hover { background: var(--blue); }
.quiet-link, .text-link { color: #505a55; font-size: 11px; font-weight: 600; }
.quiet-link span, .text-link span { margin-left: 6px; color: var(--blue); }
.chapter-foot { position: absolute; top: calc(100svh - 102px); left: 10vw; width: min(760px, 67vw); display: flex; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--rule); color: #858d89; font: 8px var(--mono); letter-spacing: .06em; }
.chapter-foot b { padding-left: 7px; color: var(--blue); font-size: 13px; font-weight: 400; }
.hero-coordinate { position: absolute; right: 9vw; bottom: 35px; display: grid; gap: 5px; color: #89908c; font: 8px var(--mono); letter-spacing: .06em; text-align: right; }
.chapter-kicker { display: flex; align-items: center; gap: 10px; }
.chapter-kicker span:first-child { color: var(--blue); }
.kicker-rule { width: 33px; height: 1px; background: #aab1ad; }
.micro-list { display: flex; align-items: center; gap: 12px; margin-top: 27px; color: #4f5854; font: 9px var(--mono); letter-spacing: .08em; }
.micro-list i { color: var(--blue); font-style: normal; }
.aside-note { margin: 38px 0 0; color: #7a827d; font-size: 11px; }
.aside-note span { margin-right: 7px; color: var(--blue); }
.signal-note, .approval-note { display: flex; align-items: center; gap: 12px; margin-top: 32px; }
.signal-icon { width: 32px; height: 32px; display: grid; place-items: center; color: var(--blue); border: 1px solid #c4cafa; border-radius: 50%; font-size: 17px; }
.signal-note b, .approval-note b { display: block; color: #434b47; font-size: 11px; }
.signal-note small, .approval-note small { display: block; margin-top: 4px; color: #89908c; font-size: 10px; }
.approval-mark { width: 30px; height: 30px; display: grid; place-items: center; border: 1px solid var(--blue); border-radius: 50%; color: var(--blue); font-size: 13px; }
.text-link { display: inline-block; margin-top: 25px; color: var(--blue); }

.plans-chapter { min-height: 100svh; padding: 105px 7vw 66px; }
.plans-content { width: min(1280px, 100%); margin: 0 auto; }
.plans-heading { display: flex; align-items: end; justify-content: space-between; gap: 35px; margin: 13px 0 27px; }
.plans-heading h2 { margin: 0; font-size: clamp(38px, 4.5vw, 55px); }
.plans-heading > p { max-width: 325px; margin: 0 4% 4px 0; color: #646d68; font-size: 12px; line-height: 1.7; }
.plan-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.plan-card { position: relative; min-height: 389px; display: flex; flex-direction: column; padding: 20px 19px 14px; border: 1px solid #d9ded8; background: #f9faf6d9; backdrop-filter: blur(5px); }

.plan-icon { color: var(--blue); font-size: 16px; }
.featured-badge { position: absolute; top: -8px; right: 16px; padding: 4px 7px; color: white; background: var(--blue); font: 7px var(--mono); letter-spacing: .05em; }
.plan-card h3 { margin: 0 0 5px; font-size: 23px; font-weight: 600; letter-spacing: -.06em; }
.plan-for { min-height: 34px; margin: 0; color: #727b76; font-size: 10px; line-height: 1.55; }
.plan-price { display: flex; align-items: baseline; gap: 6px; margin: 14px 0 12px; padding-bottom: 11px; border-bottom: 1px solid #dce0da; }
.plan-price strong { font: 600 17px var(--display); letter-spacing: -.04em; }
.plan-price span { color: #848d87; font-size: 9px; }
.plan-card ul { display: grid; gap: 8px; margin: 0 0 15px; padding: 0; list-style: none; }
.plan-card li { display: flex; gap: 7px; color: #555f59; font-size: 9px; line-height: 1.35; }
.plan-card li::before { color: var(--blue); content: "â†—"; }
.checkout-button { width: 100%; min-height: 37px; margin-top: auto; justify-content: space-between; padding-inline: 12px; font-size: 10px; }
.button-outline { color: var(--ink); border-color: #c3cac4; background: transparent; }
.button-outline:hover { color: var(--blue); border-color: var(--blue); }
.checkout-button:disabled { cursor: wait; opacity: .75; }
.plan-status { min-height: 11px; margin: 7px 0 0; color: #848d87; font-size: 8px; text-align: center; }
.plans-footnote { margin: 12px 0 0; color: #818984; font-size: 9px; text-align: center; }
.plans-footnote a { color: var(--blue); font-weight: 600; }

.faq-chapter { padding-right: 10vw; }
.faq-content { width: min(1060px, 100%); }
.faq-layout { display: grid; grid-template-columns: .83fr 1.17fr; gap: 8vw; align-items: center; margin-top: 8px; }
.faq-layout h2 { font-size: clamp(40px, 4.8vw, 58px); }
.faq-intro { margin: -4px 0 25px; color: #747c77; font-size: 12px; }
.faq-layout .button { min-height: 43px; }
.faq-list { border-top: 1px solid var(--rule); }
.faq-list details { border-bottom: 1px solid var(--rule); }
.faq-list summary { display: flex; justify-content: space-between; gap: 18px; padding: 16px 0; font-size: 11px; font-weight: 600; cursor: pointer; list-style: none; }
.faq-list summary::-webkit-details-marker { display: none; }
.faq-list summary span { color: var(--blue); font-size: 15px; font-weight: 400; }
.faq-list details p { max-width: 540px; margin: -2px 25px 16px 0; color: #717a75; font-size: 10px; line-height: 1.7; }
.site-footer { position: absolute; bottom: 0; left: 0; right: 0; min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 18px; border-top: 1px solid var(--rule); }
.site-footer .wordmark { font-size: 14px; }

.footer-center { color: #89908b; font: 7px var(--mono); letter-spacing: .05em; }
.footer-right { display: flex; align-items: center; gap: 20px; color: #727a75; font-size: 9px; }
.footer-right > span { color: #929a94; font: 7px var(--mono); }
.toast { position: fixed; z-index: 40; right: 22px; bottom: 22px; max-width: min(420px, calc(100% - 44px)); padding: 13px 17px; color: white; background: var(--ink); box-shadow: 0 10px 35px #0003; font-size: 11px; line-height: 1.5; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .2s, transform .2s; }
.toast.is-visible { opacity: 1; transform: translateY(0); }
